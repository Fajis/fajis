<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Fajis PM — Full-Stack Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
  </defs>
  <style>
    .wave { animation: drift 12s ease-in-out infinite alternate; }
    .wave2 { animation: drift 9s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    .title { font: 800 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fff; letter-spacing: 1px; animation: fade 1.2s ease-out both; }
    .sub { font: 500 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #EDE9FE; letter-spacing: 1.5px; animation: fade 1.2s .4s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <g opacity=".25" fill="#fff">
    <circle cx="90" cy="50" r="3"/><circle cx="260" cy="30" r="2"/><circle cx="980" cy="45" r="3"/>
    <circle cx="1110" cy="90" r="2"/><circle cx="170" cy="120" r="2"/><circle cx="1040" cy="150" r="2"/>
  </g>
  <path class="wave2" fill="#ffffff" fill-opacity=".12" d="M0 205 C 150 175 300 235 450 205 S 750 175 900 205 S 1200 235 1350 205 L1350 260 L0 260 Z"/>
  <path class="wave" fill="#0D1117" fill-opacity=".35" d="M0 225 C 200 195 400 255 600 225 S 1000 195 1200 225 S 1400 255 1450 225 L1450 260 L0 260 Z"/>
  <text class="title" x="600" y="118" text-anchor="middle">Fajis PM</text>
  <text class="sub" x="600" y="162" text-anchor="middle">FULL-STACK SOFTWARE DEVELOPER · BACKEND &amp; MOBILE SYSTEMS</text>
</svg>
